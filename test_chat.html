<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h2>Chat Test — Room: general</h2>
    <div id="messages"></div>
    <input id="token" placeholder="Paste your JWT token here" style="width:100%;margin-bottom:8px"/>
    <br>
    <input id="message" placeholder="Type a message"/>
    <button onclick="sendMessage()">Send</button>
    <button onclick="connect()">Connect</button>

    <script>
        let ws;

        function connect() {
            const token = document.getElementById('token').value;
            ws = new WebSocket(`ws://localhost:8000/chat/ws/general?token=${token}`);

            ws.onopen = () => addMessage('✅ Connected to general room');
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                addMessage(`${data.full_name}: ${data.content}`);
            };
            ws.onclose = () => addMessage('❌ Disconnected');
            ws.onerror = () => addMessage('⚠️ Error');
        }

        function sendMessage() {
            const content = document.getElementById('message').value;
            if (ws && content) {
                ws.send(JSON.stringify({ content }));
                document.getElementById('message').value = '';
            }
        }

        function addMessage(text) {
            const div = document.getElementById('messages');
            div.innerHTML += `<p>${text}</p>`;
            div.scrollTop = div.scrollHeight;
        }
    </script>
</body>
</html>
